name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest   # Windows Forms only builds on Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build ClinicManagement.sln -c Release
      # Unit tests use EF Core SQLite in-memory; no SQL Server needed.
      - run: dotnet test ClinicManagement.sln -c Release --no-build --logger "console;verbosity=normal"
